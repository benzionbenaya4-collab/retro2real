<!doctype html>
<html lang="he" dir="rtl">
<head>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0c0a12"><link rel="apple-touch-icon" href="../icon-192.png">
<script>(function(){var s=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;try{if(location.hash==='#dev')localStorage.r2rDev='1';if(localStorage.r2rDev)s=true}catch(e){}if(!s)location.replace('../');})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<title>מרטרו לרגיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage">
  <canvas id="view" aria-label="מסך המשחק"></canvas>
  <canvas id="gl" hidden></canvas>

  <div id="hud" hidden>
    <div class="hud-row">
      <div id="hearts" aria-label="חיים"></div>
      <div id="shards" class="px"></div>
    </div>
    <div id="world-name"></div>
    <div id="tokens" aria-label="טוקנים של פיקסי">
      <span class="tk-label">פיקסי</span>
      <div class="tk-bar"><i></i></div>
      <span class="tk-num px">100</span>
    </div>
    <div id="boost" hidden aria-label="בוסט מהירות"><span>⚡</span><div class="bt"><i></i></div></div>
    <div id="boss-bar" hidden><span id="boss-name"></span><div class="bb"><i></i></div></div>
  </div>

  <div id="bubble" hidden><img src="../assets/sprites/16bit/pixi_sprite.png" alt=""><p></p></div>
  <div id="banner" hidden></div>

  <div id="touch" hidden>
    <div id="stick"><i></i></div>
    <button id="btn-pixi" aria-label="פיקסי">פיקסי</button>
    <button id="btn-a" aria-label="חרב">A</button>
  </div>
  <button id="btn-menu" hidden aria-label="השהיה">❚❚</button>

  <section id="title" class="screen">
    <div class="logo">
      <h1>מרטרו לרגיל</h1>
      <div class="px sub">RETRO2REAL</div>
    </div>
    <div id="loading" class="px">LOADING…</div>
    <button id="press-start" class="px blink" hidden>PRESS START</button>
    <div id="continue-box" hidden>
      <button id="btn-continue" class="menu-btn">המשך מ<span></span></button>
      <button id="btn-new" class="menu-btn ghost">משחק חדש</button>
    </div>
    <p class="hint"><span class="kb">חצים / WASD – תזוזה · רווח – חרב · P – פיקסי</span><span class="tc">ג'ויסטיק – תזוזה · A – חרב · פיקסי – סריקה</span></p>
    <button id="btn-sound" class="sound">🔊</button>
  </section>

  <section id="pause" class="screen" hidden>
    <h2>הפסקה</h2>
    <button id="btn-resume" class="menu-btn">המשך</button>
    <button id="btn-restart" class="menu-btn ghost">התחל את העולם מחדש</button>
    <button id="btn-quit" class="menu-btn ghost">למסך הפתיחה</button>
  </section>

  <section id="card" class="screen" hidden>
    <div class="px era"></div>
    <h2></h2>
    <p></p>
    <button class="menu-btn">יאללה</button>
  </section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
