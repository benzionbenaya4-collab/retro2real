<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מרטרו לרגיל</title>
<meta name="description" content="מרטרו לרגיל – אבא נשאב לתוך משחק רטרו ועובר מ-8 ביט עד היום. בקרוב.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0a12">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;800;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0c0a12; --fg:#efe9f7; --muted:#9a90ad; --phos:#7dff9b; --gold:#ffcf4a; --red:#ff3d6e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: Rubik, system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  h1 { margin: 0; font-size: clamp(44px, 12vw, 96px); font-weight: 900; line-height: 1.05;
       background: linear-gradient(180deg, var(--phos), var(--gold) 55%, var(--red)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eras { font-family: "Press Start 2P", monospace; font-size: 11px; color: var(--muted); direction: ltr; letter-spacing: 1px; }
  canvas { width: 100%; max-width: 860px; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 16px; border: 6px solid #2b2538; background: #000; }
  p { margin: 0; max-width: 60ch; line-height: 1.8; font-size: 17px; }
  .soon { font-family: "Press Start 2P", monospace; color: var(--gold); font-size: 14px; direction: ltr; animation: blink 1s steps(2) infinite; }
  .play { display:inline-flex; gap:10px; align-items:center; padding:14px 26px; border:2px solid var(--phos); border-radius:14px; color:var(--fg); text-decoration:none; font:800 20px Rubik, sans-serif; background:#16131f; }
  .play b { font-family:"Press Start 2P", monospace; font-size:11px; color:var(--phos); }
  .play:hover, .play:focus-visible { background:#1f1a2c; outline:3px solid var(--gold); outline-offset:2px; }
  button.play { cursor:pointer; }
  .how { background:#16131f; border:1px solid #2b2538; border-radius:14px; padding:14px 18px; line-height:1.8; max-width:46ch; text-align:start; }
  .how b { color:var(--gold); }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .soon { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>מרטרו לרגיל</h1>
  <div class="eras">8-BIT → 16-BIT → 32-BIT → NOW</div>
  <canvas id="cv" width="256" height="144" aria-label="דן ופיקסי הולכים בעמק"></canvas>
  <p>לילה אחד, דן, צייד ואבא, לחץ על הכפתורים הלא נכונים בקונסולה הישנה של הבן שלו… ונשאב פנימה. עכשיו הוא צריך לעבור דרך כל הדורות של עולם המשחקים, מ־8 ביט ועד היום, ולעצור את ההאקר שמשחית את העולמות.</p>
  <button class="play" id="install">📲 התקינו את המשחק עכשיו</button>
  <div class="how" id="how" hidden></div>
  <div class="soon">FREE · OFFLINE · WORLD 1 READY</div>
</main>
<script>
(async () => {
  const cv = document.getElementById('cv'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const img = (s) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
  const js = (s) => fetch(s).then((r) => r.json()).catch(() => null);
  const T = await js('assets/sprites/tiles/16bit_kingdom_tileset.json'), Ti = T && await img('assets/sprites/tiles/' + T.image);
  const S = {}; for (const n of ['dan', 'pixi', 'worm']) { const j = await js(`assets/sprites/16bit/${n}.json`); if (j) S[n] = { j, i: await img(`assets/sprites/16bit/${j.image || n + '.png'}`) }; }
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
  const cell = (c, r) => r === 6 ? 'path' : (r === 5 && c === 14) ? 'castle' : (r === 5 && (c === 13 || c === 15)) ? 'wall' : r < 2 ? (hash(c * 17.3 + r * 5.1) < 0.6 ? 'tree' : 'grass') : ((r === 2 || r === 3) && c >= 3 && c <= 7) ? 'water' : r > 6 ? (hash(c + r * 9) < 0.3 ? 'tree' : 'grass') : (hash(c * 3.1 + r) < 0.08 ? 'tree' : 'grass');
  function tile(n, x, y, t) { if (!Ti) return; let k = T.tiles[n]; const a = T.anims?.[n]; if (a) k = a.frames[Math.floor(t * a.fps) % a.frames.length]; const cols = Ti.width / 16; g.drawImage(Ti, (k % cols) * 16, Math.floor(k / cols) * 16, 16, 16, x, y, 16, 16); }
  function spr(n, an, t, x, y) { const s = S[n]; if (!s?.i) return; const a = s.j.anims[an] || s.j.anims.idle, f = a.frames[Math.floor(t * a.fps) % a.frames.length], w = s.j.frameW, h = s.j.frameH, c = s.j.columns; g.drawImage(s.i, (f % c) * w, Math.floor(f / c) * h, w, h, Math.round(x - w / 2), Math.round(y - h), w, h); }
  function frame(now) { const t = now / 1000;
    for (let r = 0; r < 9; r++) for (let c = 0; c < 16; c++) tile(cell(c, r), c * 16, r * 16, t);
    const x = ((t * 28) % 300) - 30;
    spr('pixi', 'walk_right', t, x - 24, 104 - Math.abs(Math.sin(t * 6)) * 3); spr('dan', 'walk_right', t, x, 110); spr('worm', 'walk_left', t, 256 - ((t * 18) % 300) + 20, 110);
    requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
<script>
(() => {
  const btn = document.getElementById('install'), how = document.getElementById('how');
  const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
  if (standalone) { location.replace('game/'); return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let deferred = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; });
  addEventListener('appinstalled', () => { btn.textContent = '✅ המשחק הותקן!'; show('פותחים את <b>מרטרו לרגיל</b> מהמסך הראשי של הטלפון ומתחילים לשחק 🎮'); });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function show(html) { how.innerHTML = html; how.hidden = false; }
  btn.onclick = async () => {
    if (deferred) { deferred.prompt(); const r = await deferred.userChoice.catch(() => null); deferred = null;
      if (r?.outcome === 'accepted') { btn.textContent = '✅ מתקין…'; show('עוד רגע המשחק יופיע במסך הראשי. פותחים אותו משם 🎮'); } return; }
    if (ios) show('באייפון: לוחצים על <b>כפתור השיתוף</b> ⬆️ למטה, ואז על <b>"הוספה למסך הבית"</b>. אחר כך פותחים את המשחק מהמסך הראשי.');
    else show('בכרום: לוחצים על <b>⋮</b> למעלה, ואז על <b>"התקנת אפליקציה"</b> או <b>"הוספה למסך הבית"</b>. אחר כך פותחים את המשחק מהמסך הראשי.<br>אם הכפתור לא מופיע, מרעננים את הדף ומנסים שוב.');
  };
})();
</script>
</body>
</html>
